name: Publish

# Publishes to npm, and the standalone executables and the macOS app to the
# GitHub release and the Homebrew tap, when a version tag is pushed:
#
#   pnpm version patch   # or minor / major — bumps package.json and tags vX.Y.Z
#   git push --follow-tags
#
# A tag with a prerelease part (v0.2.0-canary.0) is a canary, for testing this
# pipeline end to end without reaching anyone: npm gets it under the `canary`
# dist-tag, the GitHub release is a prerelease (so `releases/latest`, which
# install.sh reads, skips it), and the tap and bucket get a separate
# `claude-profiler-canary` package instead of replacing the real one.
#
# Authenticates through npm Trusted Publishing (OIDC), so no npm token is stored
# in the repository; provenance is attached automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; don't depend on what Node bundles.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # A version published by hand — the first one has to be, before a trusted
      # publisher can be attached to the package — still gets its release.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs `pnpm verify` (build + tests) before anything is uploaded.
      - if: steps.registry.outputs.published != 'true'
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag canary ;;
            *) npm publish ;;
          esac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          # A guide to the files first, then GitHub's own changelog under it.
          { cat .github/release-notes.md
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
        shell: bash

  binaries:
    uses: ./.github/workflows/binaries.yml

  # Attaches the standalone executables to the release — where install.sh and
  # the Homebrew formula download them from — and points the tap at them.
  release-binaries:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          sha256sum claude-profiler-cli-*.tar.gz claude-profiler-cli-*.zip > checksums.txt
          cat checksums.txt
          gh release upload "$GITHUB_REF_NAME" claude-profiler-cli-*.tar.gz claude-profiler-cli-*.zip checksums.txt --clobber

      # Pushing to other repositories needs a token of its own: a fine-grained
      # PAT with Contents read/write on Softjey/homebrew-tap and
      # Softjey/scoop-bucket, stored as the PACKAGE_REPOS_TOKEN secret. Without
      # it the release still goes out, and the manifests are left to update by
      # hand.
      - name: Update the Homebrew formula and the Scoop manifest
        env:
          REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          if [ -z "$REPOS_TOKEN" ]; then
            echo "::warning::PACKAGE_REPOS_TOKEN is not set; Homebrew and Scoop were not updated"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          package=claude-profiler
          [[ "$version" == *-* ]] && package=claude-profiler-canary
          publish() { # <repo> <path in it> <generator> [generator args]
            git clone "https://x-access-token:$REPOS_TOKEN@github.com/Softjey/$1.git" "$1"
            mkdir -p "$1/$(dirname "$2")"
            "$3" "$version" binaries/checksums.txt "${@:4}" > "$1/$2"
            git -C "$1" add "$2"
            git -C "$1" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "claude-profiler $version"
            git -C "$1" push
          }
          publish homebrew-tap "Formula/$package.rb" scripts/homebrew-formula.sh "$package"
          publish scoop-bucket "bucket/$package.json" scripts/scoop-manifest.sh

  app:
    uses: ./.github/workflows/macos-app.yml
    with:
      sign: true
    secrets: inherit

  # Attaches the macOS app, zipped per architecture, to the release. Its
  # checksums go in a file of their own: install.sh reads checksums.txt and
  # expects only the executables in it.
  release-app:
    needs: [publish, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: app
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app
          sha256sum Claude-Profiler-App-macos-*.zip > checksums-app.txt
          cat checksums-app.txt
          gh release upload "$GITHUB_REF_NAME" Claude-Profiler-App-macos-*.zip checksums-app.txt --clobber \
            --repo "$GITHUB_REPOSITORY"
